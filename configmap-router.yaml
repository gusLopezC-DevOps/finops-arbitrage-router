apiVersion: v1
kind: ConfigMap
metadata:
  name: finops-arbitrage-router-router
  namespace: finops-arbitrage-router
  labels:
    app: finops-arbitrage-router
    backstage.io/kubernetes-id: finops-arbitrage-router
data:
  router.py: |
    import json, os, urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer

    PRIORITY = os.environ.get("ROUTER_PRIORITY", "cost-optimized")
    LOCAL = os.environ.get("LOCAL_ENDPOINT", "http://ollama-cpu.ml-serving.svc.cluster.local:11434").rstrip("/")
    LOCAL_MODEL = os.environ.get("LOCAL_MODEL", "llama3.2:1b")
    FALLBACK = os.environ.get("FALLBACK_ENDPOINT", "").rstrip("/")
    FALLBACK_KEY = os.environ.get("FALLBACK_API_KEY", "")

    def route():
        # cost-optimized pins traffic to the local Ollama CPU model.
        # max-performance prefers the managed OpenAI-compatible fallback when set.
        if PRIORITY == "max-performance" and FALLBACK:
            return FALLBACK + "/v1/chat/completions", None
        return LOCAL + "/api/chat", LOCAL_MODEL

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0))
            payload = json.loads(self.rfile.read(length) or b"{}")
            endpoint, model = route()
            if model:
                payload.setdefault("model", model)
            payload["stream"] = False
            headers = {"Content-Type": "application/json"}
            if model is None and FALLBACK_KEY:
                # Managed fallback leg (OmniRoute via Kong): bearer auth.
                # The local Ollama leg never sends credentials.
                headers["Authorization"] = "Bearer " + FALLBACK_KEY
            req = urllib.request.Request(
                endpoint,
                data=json.dumps(payload).encode(),
                headers=headers,
            )
            with urllib.request.urlopen(req, timeout=120) as resp:
                body = resp.read()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
                return
            self.send_response(404)
            self.end_headers()

        def log_message(self, *args):
            pass

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
