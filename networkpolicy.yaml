# Zero-trust egress for the router: it may only reach DNS, the local Ollama
# model, and the Kong load-balancer (port 80) which fronts both finops.local
# and the managed OmniRoute fallback (omniroute-internal.local). There is NO
# public-internet egress: the fallback leg stays on the LAN behind Kong.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finops-arbitrage-router-egress
  namespace: finops-arbitrage-router
  labels:
    app: finops-arbitrage-router
spec:
  podSelector:
    matchLabels:
      app: finops-arbitrage-router
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ml-serving
      ports:
        - protocol: TCP
          port: 11434
    - to:
        - ipBlock:
            cidr: 192.168.100.77/32
      ports:
        - protocol: TCP
          port: 80
