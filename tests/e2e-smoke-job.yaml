# GitOps smoke test for the FinOps arbitrage router (runs via Argo CD sync).
# POSTs a tiny chat request to the router Service; the router must forward it
# to the local Ollama model (cost-optimized) and return real tokens.
# NOTE: pod labels deliberately differ from `app: finops-arbitrage-router`
# so the router's egress NetworkPolicy does not apply to this test pod.
apiVersion: batch/v1
kind: Job
metadata:
  name: finops-e2e-smoke
  namespace: finops-arbitrage-router
  labels:
    app: finops-arbitrage-router-e2e
    backstage.io/kubernetes-id: finops-arbitrage-router
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: finops-arbitrage-router-e2e
        backstage.io/kubernetes-id: finops-arbitrage-router
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: e2e
          image: python:3.12-slim
          command: ["python3", "-c"]
          args:
            - |
              import json, sys, urllib.request
              body = json.dumps({
                  "model": "llama3.2:1b",
                  "messages": [{"role": "user", "content": "Responde con exactamente tres palabras"}],
                  "stream": False,
              }).encode()
              req = urllib.request.Request(
                  "http://finops-arbitrage-router:8080/v1/chat/completions",
                  data=body, headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=150) as r:
                  assert r.status == 200, f"router status {r.status}"
                  data = json.loads(r.read())
              try:
                  reply = data["message"]["content"]
              except KeyError:
                  reply = data["choices"][0]["message"]["content"]
              print("E2E OK, router reply:", reply.strip(), flush=True)
              assert reply.strip(), "empty reply from router"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
