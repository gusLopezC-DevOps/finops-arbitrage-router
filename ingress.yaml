# Public entrypoint for the arbitrage router (plain Kong route, no plugins:
# the pii-redaction / ai-prompt-guard KongPlugins are roadmap and do not exist
# in this cluster yet — referencing them makes Kong answer 500. Re-add the
# konghq.com/plugins annotation once the DLP plugins are installed).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finops-arbitrage-router
  namespace: finops-arbitrage-router
  labels:
    app: finops-arbitrage-router
    backstage.io/kubernetes-id: finops-arbitrage-router
spec:
  ingressClassName: kong
  rules:
    - host: finops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finops-arbitrage-router
                port:
                  number: 8080
