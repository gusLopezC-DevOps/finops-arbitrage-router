# OmniRoute (self-hosted AI gateway, 192.168.100.50:20128) registered as a
# Kong-managed internal upstream. The finops-arbitrage-router reaches it ONLY
# through this hostname (max-performance fallback leg) so Kong access logs,
# observability and the platform zero-trust model keep applying.
# The upstream lives OUTSIDE the cluster, hence the manual Endpoints object:
# the ClusterIP Service has no selector and binds to these endpoints.
apiVersion: v1
kind: Service
metadata:
  name: omniroute-upstream
  namespace: finops-arbitrage-router
  labels:
    app: finops-arbitrage-router
    backstage.io/kubernetes-id: finops-arbitrage-router
spec:
  ports:
    - name: http
      port: 80
      targetPort: 20128
---
# NOTE: plain v1 Endpoints are EXCLUDED from Argo CD management platform-wide
# ("ExcludedResourceWarning"), so the static upstream is an EndpointSlice
# (discovery.k8s.io/v1, not excluded, not deprecated). The selector-less
# Service binds to it via the kubernetes.io/service-name label.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: omniroute-upstream-1
  namespace: finops-arbitrage-router
  labels:
    app: finops-arbitrage-router
    backstage.io/kubernetes-id: finops-arbitrage-router
    kubernetes.io/service-name: omniroute-upstream
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.100.50
    conditions:
      ready: true
ports:
  - name: http
    port: 20128
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omniroute-upstream
  namespace: finops-arbitrage-router
  labels:
    app: finops-arbitrage-router
    backstage.io/kubernetes-id: finops-arbitrage-router
spec:
  ingressClassName: kong
  rules:
    - host: omniroute-internal.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: omniroute-upstream
                port:
                  number: 80
